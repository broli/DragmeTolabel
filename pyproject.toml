[build-system]
requires = ["hatchling>=1.20.0"]
build-backend = "hatchling.build"

[project]
name = "dragmetolabel"
version = "0.2.0"
description = "Computer Vision & Polygon Surface Replacement Web Application for Sales Reps"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.12"
authors = [{ name = "DragMeToLabel Contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "opencv-python-headless>=4.9.0",
  "numpy>=1.24",
  "pillow>=10.0",
  "scipy>=1.11",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.4.0",
  "httpx>=0.27.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.4.0",
  "httpx>=0.27.0",
]

[project.scripts]
dragmetolabel = "backend.app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["_legacy_archive", ".*", "build", "dist", "*.egg-info"]
addopts = "-m 'not network'"
markers = [
  "network: mark a test that accesses an external network service.",
]
filterwarnings = [
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
  "ignore::DeprecationWarning:fastapi.testclient",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
]
ignore = [
  "E501", # line-length handled by formatter
]

[tool.ruff.lint.isort]
force-single-line = false

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
